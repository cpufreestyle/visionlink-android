name: Build & Test & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build against'
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  # ─── Stage 1: Lint + Test ───
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch settings.gradle.kts for CI (skip Aliyun mirror)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          echo "Patched settings.gradle.kts (removed Aliyun mirror)"

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ─── Stage 2: Build APK ───
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch settings.gradle.kts for CI (skip Aliyun mirror)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          echo "Patched settings.gradle.kts (removed Aliyun mirror)"

      - name: "Create local.properties (CI fallback: empty API keys)"
        run: |
          cat > local.properties << 'EOF'
          stepfun.api.key=
          stepfun.api.key.test=
          lmstudio.url=http://10.0.2.2:1234/v1/chat/completions
          EOF

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              echo "Build succeeded!"
              exit 0
            fi
            echo "Build attempt $i failed, waiting 30s before retry..."
            sleep 30
          done
          echo "All 3 build attempts failed"
          exit 1

      - name: Rename APK
        run: |
          TAG="${{ github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "visionlink-android-${TAG}.apk"
          ls -lh "visionlink-android-${TAG}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: visionlink-android-*.apk
          retention-days: 30

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: visionlink-android-*.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
