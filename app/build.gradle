plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nieao.blindaid'
    compileSdk 35

    defaultConfig {
        applicationId "com.nieao.blindaid"
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    // tflite 模型与 mediapipe .task 均需 mmap,不能压缩
    androidResources {
        noCompress 'tflite', 'task'
    }
    // MediaPipe 与 TFLite 各自携带 native so,同名冲突时取第一个
    packaging {
        jniLibs {
            pickFirsts += ['**/libtensorflowlite_jni.so', '**/libtensorflowlite_gpu_jni.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // TensorFlow Lite — YOLO 推理
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // MediaPipe Tasks Vision — 手部关键点(手指指向)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // 单元测试(融合逻辑冒烟)
    testImplementation 'junit:junit:4.13.2'
}
